# Study regions (docs/PLAN.md Section 3).
# Boxes are in degrees: latitude south to north, longitude west to east.
# NASA POWER regional requests allow at most about 4.5 x 4.5 degrees,
# so larger boxes are split into tiles of equal size.
max_tile_degrees: 4.5

regions:
  florida:
    name: Florida
    climate: humid heat
    box:
      lat_min: 24.5
      lat_max: 31.0
      lon_min: -87.6
      lon_max: -80.0
    land_mask: true   # the box contains a lot of sea
    state: Florida    # keep only squares inside this US state (Natural Earth admin-1)
    places:           # labels on the region map only
      - {name: Tallahassee, lat: 30.44, lon: -84.28}
      - {name: Orlando, lat: 28.54, lon: -81.38}
      - {name: Tampa, lat: 27.95, lon: -82.46}
      - {name: Miami, lat: 25.76, lon: -80.19}
    tiles:
      - {lat_min: 24.5,  lat_max: 27.75, lon_min: -87.6, lon_max: -83.8}
      - {lat_min: 24.5,  lat_max: 27.75, lon_min: -83.8, lon_max: -80.0}
      - {lat_min: 27.75, lat_max: 31.0,  lon_min: -87.6, lon_max: -83.8}
      - {lat_min: 27.75, lat_max: 31.0,  lon_min: -83.8, lon_max: -80.0}

  phoenix:
    name: Phoenix region, Arizona
    climate: dry heat
    # Centered on Phoenix (33.45 N, 112.07 W): Sonoran Desert lowlands in the
    # south, higher plateau toward Flagstaff in the north. Fits in one tile.
    box:
      lat_min: 31.5
      lat_max: 35.5
      lon_min: -114.5
      lon_max: -110.0
    land_mask: true
    state: Arizona    # drops squares in California and Mexico
    places:
      - {name: Phoenix, lat: 33.45, lon: -112.07}
      - {name: Tucson, lat: 32.22, lon: -110.97}
      - {name: Flagstaff, lat: 35.20, lon: -111.65}
      - {name: Yuma, lat: 32.69, lon: -114.62}
    tiles:
      - {lat_min: 31.5, lat_max: 35.5, lon_min: -114.5, lon_max: -110.0}
